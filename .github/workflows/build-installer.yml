name: Build installer

# Builds the Windows installer on a GitHub runner. Smart App Control blocks
# freshly linked unsigned build scripts on some Windows 11 machines, which stops
# a local `tauri build` before it starts; the runners have no such policy.
#
# Runs on every push to main, from the Actions tab ("Run workflow"), or on a v*
# tag, which also publishes the installer as a release.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch ONNX Runtime
        shell: pwsh
        run: |
          .\fetch-models.ps1
          if (-not (Test-Path runtime/onnxruntime.dll)) {
            Write-Host "::error::fetch-models.ps1 left no runtime/onnxruntime.dll"
            exit 1
          }
          Get-ChildItem runtime, models | Select-Object Name, Length | Format-Table -AutoSize

      - name: Install npm dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build

      # The models and the ONNX runtime are found by walking outward from the
      # executable, so where the bundler puts them decides whether an installed
      # build works. Report it rather than fail: the installer is still worth
      # having, and the listing says what to fix.
      - name: Report where the resources landed
        shell: pwsh
        continue-on-error: true
        run: |
          $release = Join-Path (cargo metadata --no-deps --format-version 1 |
                                ConvertFrom-Json).target_directory "release"

          # -Include needs a wildcard in the path to work with -Recurse, so
          # filter on the piped objects instead.
          $found = Get-ChildItem $release -Recurse -File -ErrorAction SilentlyContinue |
                   Where-Object { $_.Extension -eq '.onnx' -or $_.Name -eq 'onnxruntime.dll' }

          Write-Host "--- models and runtime under release ---"
          if ($found) {
            $found | ForEach-Object {
              Write-Host "  $($_.FullName.Substring($release.Length))  ($([math]::Round($_.Length/1MB,2)) MB)"
            }
          } else {
            Write-Host "  none found"
          }

          Write-Host "`n--- installer ---"
          Get-ChildItem $release -Recurse -File -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'bundle' } |
            ForEach-Object { Write-Host "  $($_.Name)  ($([math]::Round($_.Length/1MB,1)) MB)" }

      - uses: actions/upload-artifact@v4
        with:
          name: fotografije-za-dokumente-installer
          path: |
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # A tag push also publishes the installer, so it can be downloaded
      # without signing in to GitHub.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
