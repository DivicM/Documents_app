name: Build installer

# Builds the Windows installer on a GitHub runner. Smart App Control blocks
# freshly linked unsigned build scripts on some Windows 11 machines, which stops
# a local `tauri build` before it starts; the runners have no such policy.
#
# Run it from the Actions tab ("Run workflow"), or by pushing a v* tag, which
# also publishes the installer as a release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch ONNX Runtime
        shell: pwsh
        run: .\fetch-models.ps1

      - name: Install npm dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build

      # The models and the ONNX runtime are found by walking outward from the
      # executable, so a bundling change that moves them breaks an installed
      # build while a development build keeps working. Fail here instead.
      - name: Check the resources were bundled
        shell: pwsh
        run: |
          $dir = "target/release"
          $wanted = @(
            "models/face_detection_yunet_2023mar.onnx",
            "models/u2netp.onnx",
            "runtime/onnxruntime.dll"
          )
          $missing = @()
          foreach ($w in $wanted) {
            $leaf = Split-Path $w -Leaf
            $hit = Get-ChildItem $dir -Recurse -Filter $leaf -ErrorAction SilentlyContinue |
                   Select-Object -First 1
            if ($hit) {
              Write-Host "found $leaf at $($hit.FullName)"
            } else {
              $missing += $w
            }
          }
          if ($missing) {
            Write-Host "::error::not bundled: $($missing -join ', ')"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: fotografije-za-dokumente-installer
          path: |
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # A tag push also publishes the installer, so it can be downloaded
      # without signing in to GitHub.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
