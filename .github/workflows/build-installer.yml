name: Build installer

# Builds the Windows installer on a GitHub runner. Smart App Control blocks
# freshly linked unsigned build scripts on some Windows 11 machines, which stops
# a local `tauri build` before it starts; the runners have no such policy.
#
# Runs on every push to main, from the Actions tab ("Run workflow"), or on a v*
# tag, which also publishes the installer as a release.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch ONNX Runtime
        shell: pwsh
        run: |
          .\fetch-models.ps1
          if (-not (Test-Path runtime/onnxruntime.dll)) {
            Write-Host "::error::fetch-models.ps1 left no runtime/onnxruntime.dll"
            exit 1
          }
          Get-ChildItem runtime, models | Select-Object Name, Length | Format-Table -AutoSize

      - name: Install npm dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build

      # The models and the ONNX runtime are found by walking outward from the
      # executable, so a bundling change that moves them breaks an installed
      # build while a development build keeps working. Fail here instead.
      - name: Check the resources were bundled
        shell: pwsh
        run: |
          # Where the build output actually landed, rather than assuming.
          $targetDir = (cargo metadata --no-deps --format-version 1 |
                        ConvertFrom-Json).target_directory
          Write-Host "target directory: $targetDir"
          Write-Host "source files present: models=$(Test-Path models), runtime dll=$(Test-Path runtime/onnxruntime.dll)"

          $release = Join-Path $targetDir "release"
          Write-Host "`n--- .onnx and onnxruntime.dll under $release ---"
          $found = Get-ChildItem $release -Recurse -Include *.onnx, onnxruntime.dll -ErrorAction SilentlyContinue
          if ($found) {
            $found | ForEach-Object { Write-Host "  $($_.FullName.Substring($release.Length))" }
          } else {
            Write-Host "  none"
          }

          Write-Host "`n--- installer ---"
          Get-ChildItem $release -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'bundle' } |
            ForEach-Object { Write-Host "  $($_.FullName) ($([math]::Round($_.Length/1MB,1)) MB)" }

          $wanted = @("face_detection_yunet_2023mar.onnx", "u2netp.onnx", "onnxruntime.dll")
          $missing = $wanted | Where-Object { $n = $_; -not ($found | Where-Object { $_.Name -eq $n }) }
          if ($missing) {
            Write-Host "::error::not bundled: $($missing -join ', ')"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: fotografije-za-dokumente-installer
          path: |
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # A tag push also publishes the installer, so it can be downloaded
      # without signing in to GitHub.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/bundle/nsis/*.exe
